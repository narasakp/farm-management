<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff !important;
      overflow-x: hidden;
    }
    
    flt-glass-pane {
      background-color: #ffffff !important;
      pointer-events: none !important; /* ✅ Fix: ให้ pointer events ผ่านไปถึง elements */
    }
    
    flutter-view {
      background-color: #ffffff !important;
    }
    
    flt-scene-host {
      background-color: #ffffff !important;
    }
    
    /* ✅ Fix: Flutter Web Canvas Layer Issues */
    canvas {
      z-index: 0 !important; /* ให้ canvas อยู่ชั้นล่าง */
    }
    
    /* ✅ Fix: Text Rendering Layer */
    flt-text-editing-host,
    flt-text-editing-element {
      z-index: 999 !important; /* ให้ text อยู่ชั้นบน */
    }
    
    /* ✅ Fix: Prevent overlay on interactive elements */
    button, a, input, select {
      position: relative !important;
      z-index: 100 !important;
    }
    
    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #ffffff !important;
    }
  </style>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="livestock_farm_management">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>farm</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Google OAuth Configuration (Knowledge Base Solution) -->
  <script>
    // TEMPORARY: Disable Google OAuth due to configuration issues
    // User can still login with username/password
    window.addEventListener('load', function() {
      console.log('⚠️ Google OAuth temporarily disabled - use username/password login');
      console.log('📝 To enable: Configure OAuth 2.0 in Google Cloud Console');
      console.log('   1. Add http://localhost:8096 to Authorized JavaScript origins');
      console.log('   2. Add http://localhost:8096 to Authorized redirect URIs');
      console.log('   3. Wait 5-10 minutes for changes to propagate');
    });
  </script>
  
  <!-- Logout Function -->
  <script>
    function performLogout() {
      console.log('🚪 Logout called');
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = '/login';
    }
  </script>
  
  <!-- Email Sender for OTP -->
  <script src="email_sender.js"></script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
