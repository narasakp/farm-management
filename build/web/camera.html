<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ถ่ายรูป</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Sarabun', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 15px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 22px;
        }
        
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            flex: 1;
            min-height: 0;
        }
        
        #video {
            width: 100%;
            max-width: 650px;
            height: 100%;
            border-radius: 15px;
            background: #000;
            display: block;
            object-fit: cover;
            aspect-ratio: 3/4;
        }
        
        #canvas {
            display: none;
        }
        
        #preview {
            display: none;
            width: 100%;
            max-width: 650px;
            height: 100%;
            border-radius: 15px;
            background: #000;
            object-fit: cover;
            aspect-ratio: 3/4;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: auto;
        }
        
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        #captureBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #captureBtn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        #retakeBtn {
            background: #f39c12;
            color: white;
            display: none;
        }
        
        #retakeBtn:hover {
            background: #e67e22;
        }
        
        #confirmBtn {
            background: #27ae60;
            color: white;
            display: none;
        }
        
        #confirmBtn:hover {
            background: #229954;
        }
        
        #closeBtn {
            background: #e74c3c;
            color: white;
        }
        
        #closeBtn:hover {
            background: #c0392b;
        }
        
        .message {
            text-align: center;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: none;
            font-size: 13px;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 ถ่ายรูปเกษตรกร</h1>
        
        <div id="message" class="message"></div>
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <img id="preview" alt="ภาพที่ถ่าย">
        </div>
        <canvas id="canvas"></canvas>
        
        <div class="controls">
            <button id="captureBtn">
                <span>📷</span>
                <span>ถ่ายรูป</span>
            </button>
            <button id="retakeBtn">
                <span>🔄</span>
                <span>ถ่ายใหม่</span>
            </button>
            <button id="confirmBtn">
                <span>✓</span>
                <span>บันทึก</span>
            </button>
            <button id="closeBtn">
                <span>✕</span>
                <span>ปิด</span>
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const closeBtn = document.getElementById('closeBtn');
        const message = document.getElementById('message');
        
        let stream = null;
        let capturedImage = null;
        
        // ฟังก์ชันแสดงข้อความ
        function showMessage(text, type = 'info') {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    message.style.display = 'none';
                }, 3000);
            }
        }
        
        // เปิดกล้อง
        async function startCamera() {
            try {
                showMessage('กำลังเปิดกล้อง...', 'info');
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1200 },
                        height: { ideal: 1600 },
                        aspectRatio: { ideal: 3/4 },
                        facingMode: 'user'
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                preview.style.display = 'none';
                showMessage('กล้องพร้อมใช้งาน', 'success');
                
                captureBtn.style.display = 'flex';
                retakeBtn.style.display = 'none';
                confirmBtn.style.display = 'none';
                
            } catch (error) {
                console.error('Camera error:', error);
                showMessage('ไม่สามารถเปิดกล้องได้: ' + error.message, 'error');
            }
        }
        
        // ถ่ายรูป - บังคับให้เป็นแนวตั้ง 3:4
        captureBtn.addEventListener('click', () => {
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            // คำนวณขนาดที่ต้องการ (Portrait 3:4)
            // ถ้า video เป็นแนวนอน ให้ครอปเป็นแนวตั้ง
            const targetAspectRatio = 3 / 4; // Portrait
            let targetWidth, targetHeight, sourceX, sourceY, sourceWidth, sourceHeight;
            
            // คำนวณว่าจะครอปจากส่วนไหนของ video
            const videoAspectRatio = videoWidth / videoHeight;
            
            if (videoAspectRatio > targetAspectRatio) {
                // Video กว้างเกินไป -> ครอปซ้ายขวา
                sourceHeight = videoHeight;
                sourceWidth = videoHeight * targetAspectRatio;
                sourceX = (videoWidth - sourceWidth) / 2;
                sourceY = 0;
            } else {
                // Video สูงเกินไป -> ครอปบนล่าง
                sourceWidth = videoWidth;
                sourceHeight = videoWidth / targetAspectRatio;
                sourceX = 0;
                sourceY = (videoHeight - sourceHeight) / 2;
            }
            
            // กำหนดขนาด canvas เป็น Portrait 3:4
            const outputWidth = 1200;  // ความกว้าง
            const outputHeight = 1600; // ความสูง (4/3 ของความกว้าง)
            
            canvas.width = outputWidth;
            canvas.height = outputHeight;
            
            const context = canvas.getContext('2d');
            // วาดภาพโดยครอปจาก video
            context.drawImage(
                video,
                sourceX, sourceY, sourceWidth, sourceHeight,  // Source (ครอปจาก video)
                0, 0, outputWidth, outputHeight               // Destination (canvas)
            );
            
            // แปลงเป็น base64
            capturedImage = canvas.toDataURL('image/jpeg', 0.85);
            
            // แสดงรูปที่ถ่ายใน img preview
            preview.src = capturedImage;
            video.style.display = 'none';
            preview.style.display = 'block';
            
            // แสดงปุ่มที่เหมาะสม
            captureBtn.style.display = 'none';
            retakeBtn.style.display = 'flex';
            confirmBtn.style.display = 'flex';
            
            showMessage('ถ่ายรูปเรียบร้อย (แนวตั้ง 3:4) กรุณาตรวจสอบและบันทึก', 'success');
        });
        
        // ถ่ายใหม่
        retakeBtn.addEventListener('click', () => {
            video.style.display = 'block';
            preview.style.display = 'none';
            
            captureBtn.style.display = 'flex';
            retakeBtn.style.display = 'none';
            confirmBtn.style.display = 'none';
            
            capturedImage = null;
            showMessage('พร้อมถ่ายรูปใหม่', 'info');
        });
        
        // บันทึกรูป
        confirmBtn.addEventListener('click', () => {
            if (capturedImage) {
                // ส่งข้อมูลกลับไปยัง parent window
                const base64Data = capturedImage.split(',')[1]; // เอาแค่ส่วน base64 ไม่เอา "data:image/jpeg;base64,"
                
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'camera_photo',
                        data: base64Data
                    }, '*');
                    
                    showMessage('บันทึกรูปภาพสำเร็จ', 'success');
                    
                    // ปิดหน้าต่างหลังจาก 1 วินาที
                    setTimeout(() => {
                        window.close();
                    }, 1000);
                } else {
                    showMessage('ไม่สามารถส่งข้อมูลได้', 'error');
                }
            }
        });
        
        // ปิดหน้าต่าง
        closeBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            window.close();
        });
        
        // ปิดกล้องเมื่อปิดหน้าต่าง
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
        
        // เริ่มกล้องทันทีเมื่อโหลดหน้า
        startCamera();
    </script>
</body>
</html>
