name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build web
      run: flutter build web --base-href="/farm-management/"
    
    - name: Add floating feedback icon
      run: |
        cat >> build/web/index.html << 'EOF'
        
        <!-- Floating Feedback Icon -->
        <div id="floating-feedback" style="
          position: fixed;
          bottom: 20px;
          left: 20px;
          width: 60px;
          height: 60px;
          background-color: #DAA520;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          box-shadow: 0 4px 12px rgba(218, 165, 32, 0.3);
          z-index: 1000;
          transition: all 0.3s ease;
          opacity: 0;
          visibility: hidden;
        " title="ข้อเสนอแนะ">
          <span style="font-size: 24px; color: white;">💬</span>
        </div>

        <script>
          function updateFeedbackIconVisibility() {
            const feedbackIcon = document.getElementById('floating-feedback');
            const currentPath = window.location.hash || window.location.pathname;
            
            if (currentPath.includes('login') || 
                currentPath.includes('register') || 
                currentPath === '' || 
                currentPath === '/' || 
                currentPath === '#/') {
              feedbackIcon.style.opacity = '0';
              feedbackIcon.style.visibility = 'hidden';
            } else if (currentPath.includes('#/feedback')) {
              feedbackIcon.style.opacity = '0';
              feedbackIcon.style.visibility = 'hidden';
            } else if (currentPath.includes('#/dashboard') || 
                       currentPath.includes('#/livestock') ||
                       currentPath.includes('#/trading') ||
                       currentPath.includes('#/transport') ||
                       currentPath.includes('#/research-development')) {
              feedbackIcon.style.opacity = '1';
              feedbackIcon.style.visibility = 'visible';
            } else {
              feedbackIcon.style.opacity = '0';
              feedbackIcon.style.visibility = 'hidden';
            }
          }

          function navigateToFeedback() {
            window.location.hash = '#/feedback';
          }

          document.addEventListener('DOMContentLoaded', function() {
            const feedbackIcon = document.getElementById('floating-feedback');
            
            feedbackIcon.addEventListener('click', navigateToFeedback);
            
            feedbackIcon.addEventListener('mouseenter', function() {
              this.style.transform = 'scale(1.1)';
              this.style.boxShadow = '0 6px 16px rgba(218, 165, 32, 0.4)';
            });
            
            feedbackIcon.addEventListener('mouseleave', function() {
              this.style.transform = 'scale(1)';
              this.style.boxShadow = '0 4px 12px rgba(218, 165, 32, 0.3)';
            });
            
            updateFeedbackIconVisibility();
            
            window.addEventListener('hashchange', updateFeedbackIconVisibility);
            
            setTimeout(updateFeedbackIconVisibility, 1000);
            setInterval(updateFeedbackIconVisibility, 2000);
          });
        </script>
        </body>
        </html>
        EOF
        
        # Remove duplicate closing tags
        sed -i '$ { /^<\/body>$/d; /^<\/html>$/d; }' build/web/index.html
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'build/web'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
