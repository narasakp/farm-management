name: livestock_farm_management
description: A comprehensive livestock farm management web application

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  js: ^0.7.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  crypto: ^3.0.3
  go_router: ^14.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  fl_chart: ^0.68.0
  responsive_framework: ^1.4.0
  
  # Firebase Core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_analytics: ^11.3.3
  
  # State Management (Riverpod)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Storage & Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network & Connectivity
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  
  # Utilities
  json_annotation: ^4.9.0
  
  # Image & File Picker
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.1
  file_picker: ^10.3.3
  image: ^4.1.7
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.0
  uni_links: ^0.5.1
  share_plus: ^12.0.0
  qr_flutter: ^4.1.0
  timeago: ^3.7.0
  
  # Rich Text Editor
  flutter_quill: ^11.0.0
  flutter_quill_extensions: ^11.0.0
  vsc_quill_delta_to_html: ^1.0.2
  flutter_html: ^3.0.0-beta.2
  
  # Excel Export
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

# Force archive version for excel package compatibility
dependency_overrides:
  archive: 3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/thailand.json
    - assets/images/
